ariant": "#dee1f8", "on-secondary-container": "#007346" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "spacing-sm": "0.75rem", "screen-gutter": "1.25rem", "spacing-2xl": "2rem", "spacing-lg": "1.25rem", "spacing-2xs": "0.25rem", "spacing-xs": "0.5rem", "spacing-md": "1rem", "spacing-3xl": "2.5rem", "spacing-xl": "1.5rem", "card-gap": "0.875rem" }, "fontFamily": { "body-lg": ["Nunito Sans"], "headline-md": ["Quicksand"], "label-sm": ["Quicksand"], "body-sm": ["Nunito Sans"], "headline-sm": ["Quicksand"], "body-md": ["Nunito Sans"], "headline-xl": ["Quicksand"], "label-lg": ["Quicksand"], "headline-lg": ["Quicksand"], "label-md": ["Quicksand"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "800" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-xl": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen antialiased pt-safe pb-safe"><main class="flex flex-col relative w-full px-screen-gutter bg-surface min-h-screen"><div class="flex flex-col w-full relative select-none pb-8 overflow-hidden items-center justify-between min-h-[720px]">
<!-- Floating ambient playful background elements -->
<div class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
<!-- Star Sparkle 1 -->
<div class="absolute top-6 left-6 text-tertiary-fixed-dim opacity-70 animate-pulse">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
<!-- Star Sparkle 2 -->
<div class="absolute top-24 right-8 text-primary-container opacity-60 animate-bounce" style="animation-duration: 3.2s;">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<!-- Cloud / Bubble 1 -->
<div class="absolute top-44 -left-6 w-24 h-14 bg-surface-container-high/60 rounded-full blur-[1px]"></div>
<div class="absolute top-40 left-4 w-12 h-12 bg-surface-container-high/70 rounded-full blur-[1px]"></div>
<!-- Cloud / Bubble 2 -->
<div class="absolute top-60 -right-8 w-28 h-16 bg-secondary-fixed/30 rounded-full blur-[2px]"></div>
<!-- Sweet heart floating -->
<div class="absolute top-[340px] right-6 text-primary-fixed-dim opacity-75">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<!-- Star Sparkle 3 -->
<div class="absolute bottom-28 left-8 text-tertiary-fixed-dim opacity-60">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">hotel_class</span>
</div>
</div>
<!-- Top Spacing -->
<div class="w-full pt-4"></div>
<!-- Centered Brand Mascot and Titles -->
<div class="flex flex-col items-center text-center px-4 w-full max-w-xs mx-auto">
<!-- Mascot Circular Badge with floating bounce -->
<div class="relative mb-5 group cursor-pointer transition-transform duration-300 hover:scale-105 active:scale-95" id="mascotBadge">
<!-- Glow rim ring -->
<div class="absolute -inset-2 bg-gradient-to-tr from-primary-fixed to-secondary-fixed rounded-full blur-sm opacity-60"></div>
<!-- Main Badge container with dual rim skeuomorphic cushion -->
<div class="relative w-44 h-44 rounded-full bg-surface-container-lowest p-2 shadow-xl flex items-center justify-center overflow-hidden">
<div class="w-full h-full rounded-full bg-surface-container-low flex items-center justify-center relative overflow-hidden">
<!-- Mascot Chibi Logo -->
<img alt="Homie Chibi Mascot House" class="w-full h-full object-contain p-1 transform transition-transform duration-500 ease-out" id="mascotImg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE1braPwQCRg0-hl7O0H-lQ3Z-dW-guU4oLnrSAfCZJyozhhochqnupjaYDdsUFwruxPT-ZGyu0f1dC_fsQt4Uz_OFhVSWpSoJy8X3Gag7rOZWnoMY1wj8m7Q6z7rATsMYTlQOl1KRHVsLjcsoI0HqcNCPq8SRmeKjdILI4dKF9oCT_m6KL6HVpk8hGa3UPf-2LoObGsD0mKZKrvgvwkqIKEwCQeDiW_tcq3D-B5cP6D7gT5g_hAWN"/>
</div>
</div>
<!-- Cheeky floating heart on chimney peak -->
<div class="absolute -top-1 right-3 bg-surface-container-lowest text-primary-container p-1.5 rounded-full shadow-md animate-bounce" style="animation-duration: 2.2s;">
<span class="material-symbols-outlined text-[22px] block" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
<!-- App Title with Chibi Pop Personality -->
<div class="flex flex-col items-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-fixed/50 text-on-secondary-fixed mb-2 shadow-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">pets</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase">Happy House Sharing</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary leading-tight tracking-tight font-black">
        Homie
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 px-2 leading-snug">
        Where doing chores together feels cozy & fun! ✨
      </p>
</div>
</div>
<!-- Action Area with chunky tactile buttons -->
<div class="w-full max-w-sm flex flex-col gap-3.5 px-2 mt-6">
<!-- Google OAuth Button -->
<button class="group relative w-full h-[54px] bg-surface-container-lowest text-on-surface rounded-full shadow-md flex items-center justify-center px-6 transition-all duration-150 active:translate-y-[3px] active:shadow-sm" id="btnGoogle" style="box-shadow: 0 4px 0 #dee1f8, 0 8px 18px rgba(45, 49, 66, 0.07);" type="button">
<!-- Official Google Icon -->
<div class="w-6 h-6 flex items-center justify-center mr-3 shrink-0">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
</div>
<span class="font-label-lg text-label-lg font-bold text-on-surface tracking-wide">
        Sign in with Google
      </span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant text-[20px] transition-transform group-hover:translate-x-0.5">
        arrow_forward_ios
      </span>
</button>
<!-- Microsoft OAuth Button -->
<button class="group relative w-full h-[54px] bg-surface-container-lowest text-on-surface rounded-full shadow-md flex items-center justify-center px-6 transition-all duration-150 active:translate-y-[3px] active:shadow-sm" id="btnMicrosoft" style="box-shadow: 0 4px 0 #dee1f8, 0 8px 18px rgba(45, 49, 66, 0.07);" type="button">
<!-- Official Microsoft 4-Color Tile Icon -->
<div class="w-6 h-6 flex items-center justify-center mr-3 shrink-0">
<svg class="w-5 h-5" viewbox="0 0 21 21">
<rect fill="#F25022" height="9" width="9" x="1" y="1"></rect>
<rect fill="#7FBA00" height="9" width="9" x="11" y="1"></rect>
<rect fill="#00A4EF" height="9" width="9" x="1" y="11"></rect>
<rect fill="#FFB900" height="9" width="9" x="11" y="11"></rect>
</svg>
</div>
<span class="font-label-lg text-label-lg font-bold text-on-surface tracking-wide">
        Sign in with Microsoft
      </span>
<span class="material-symbols-outlined ml-auto text-on-surface-variant text-[20px] transition-transform group-hover:translate-x-0.5">
        arrow_forward_ios
      </span>
</button>
<!-- Quick Pill Perks Tag -->
<div class="flex items-center justify-center gap-3 pt-2">
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-secondary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm font-semibold">Fast 1-Tap Access</span>
</div>
<span class="text-surface-dim">•</span>
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-tertiary-container" style="font-variation-settings: 'FILL' 1;">lock_open</span>
<span class="font-label-sm text-label-sm font-semibold">No Passwords</span>
</div>
</div>
</div>
<!-- Bottom Guidelines / Warm House Rules Micro-copy -->
<div class="w-full max-w-xs px-3 text-center mt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
      By tapping in, you agree to our 
      <a class="font-bold text-primary hover:underline underline-offset-2" href="#">Cozy Guidelines</a> & 
      <a class="font-bold text-primary hover:underline underline-offset-2" href="#">House Rules</a> 🏡
    </p>
</div>
</div>
<script>
  (function() {
    const badge = document.getElementById('mascotBadge');
    const mascotImg = document.getElementById('mascotImg');
    
    // Playful mascot bounce on click
    if (badge && mascotImg) {
      badge.addEventListener('click', () => {
        mascotImg.style.transform = 'scale(1.18) rotate(-4deg)';
        setTimeout(() => {
          mascotImg.style.transform = 'scale(0.95) rotate(3deg)';
        }, 180);
        setTimeout(() => {
          mascotImg.style.transform = 'scale(1) rotate(0deg)';
        }, 360);
      });
    }

    // Gentle tactile feedback on OAuth clicks
    const setupTapEffect = (btnId) => {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.addEventListener('mousedown', () => {
        btn.style.boxShadow = '0 1px 0 #dee1f8, 0 2px 6px rgba(45, 49, 66, 0.05)';
      });
      const resetBtn = () => {
        btn.style.boxShadow = '0 4px 0 #dee1f8, 0 8px 18px rgba(45, 49, 66, 0.07)';
      };
      btn.addEventListener('mouseup', resetBtn);
      btn.addEventListener('mouseleave', resetBtn);
    };

    setupTapEffect('btnGoogle');
    setupTapEffect('btnMicrosoft');
  })();
</script></main></body></html>
